name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The project baseline is macOS 27 / Xcode 27. The on-device model itself
    # is not exercised in CI, only compiled against. Pin the runner label to a
    # macOS 27 image once GitHub publishes one.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Lint
        run: swift format lint --recursive --strict Sources Tests Package.swift
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
