name: CI

# Disabled for now: this needs a macOS 27 / Xcode 27 runner, which has not
# been provisioned yet. The job can still be started by hand from the Actions
# tab. Restore push/pull_request triggers once a runner exists.
on:
  workflow_dispatch:

jobs:
  check:
    # The on-device model itself is not exercised in CI, only compiled against.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Lint
        run: scripts/check lint
      - name: Build (warnings are errors)
        run: scripts/check build
      - name: Test
        run: scripts/check test
